run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Reports suspicious constructs
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Advanced Go linter
    - unused        # Check for unused constants, variables, functions
    - gofmt         # Check formatting
    - goimports     # Check imports formatting
    - misspell      # Find commonly misspelled words
    - revive        # Fast, configurable, extensible linter
    - typecheck     # Type-check Go code
    - bodyclose     # Check HTTP response body is closed
    - errorlint     # Find code that causes problems with error wrapping
    - gocritic      # Comprehensive Go source code linter
    - nilerr        # Find code returning nil even if error checks fail
    - predeclared   # Find code that shadows predeclared identifiers
    - exportloopref # Check for pointers to loop variables
    - whitespace    # Check for unnecessary whitespace

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  govet:
    enable-all: true
    disable:
      - shadow  # Can be noisy
  
  staticcheck:
    checks: ["all"]
  
  revive:
    rules:
      - name: exported
        arguments:
          - checkPrivateReceivers
          - disableStutteringCheck
  
  goimports:
    local-prefixes: github.com/blackwell-systems/goldenthread

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  
  exclude-rules:
    # Exclude some linters from test files
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
    
    # Exclude fuzz test files from some linters
    - path: fuzz_test\.go
      linters:
        - errcheck
        - gocritic

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
