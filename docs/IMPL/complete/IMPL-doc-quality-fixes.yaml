known_issues:
    - title: Array min/max emitter gap (source code, not documentation)
      description: |
        The parser stores min/max for arrays in Rules.Min/Rules.Max (float64), but the
        emitter reads MinItems/MaxItems (int ptr). There is no conversion between them.
        This means `gt:"min:1"` on a []string field may not produce .min(1) in generated
        output. This is a source code bug outside the scope of this documentation-only task.
        TAG_SPEC.md should document what the parser accepts (which is min:N/max:N), and
        the emitter gap should be filed as a separate source code issue.
      status: Pre-existing source bug, out of scope for this task
      workaround: Document the tag syntax as accepted by the parser; note emitter behavior may differ
state: SCOUT_PENDING
